<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GH Review Copy — Options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.45;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      textarea {
        width: 100%;
        min-height: 6rem;
        box-sizing: border-box;
        padding: 0.6rem 0.75rem;
        font: inherit;
        border-radius: 6px;
        border: 1px solid #afb8c1;
      }
      .hint {
        color: #656d76;
        font-size: 0.9rem;
        margin: 0.5rem 0 1rem;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border-radius: 6px;
        border: 1px solid #afb8c1;
        background: #f6f8fa;
        cursor: pointer;
      }
      button.primary {
        background: #1f883d;
        border-color: #1f883d;
        color: #fff;
      }
      #status {
        font-size: 0.9rem;
        color: #1f883d;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>GH Review Copy</h1>
    <label for="prefix">Clipboard prefix</label>
    <textarea id="prefix" spellcheck="true"></textarea>
    <p class="hint">
      Placed once at the top of the copied text. Leave empty to start directly with
      <code>path:line comment</code> lines.
    </p>
    <div class="row">
      <button type="button" class="primary" id="save">Save</button>
      <button type="button" id="reset">Reset to default</button>
      <span id="status" aria-live="polite"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
